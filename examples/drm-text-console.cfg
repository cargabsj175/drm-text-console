# drm-text-console.cfg - ejemplo de menu de juegos
# Copiar a la tarjeta SD del dispositivo: /mnt/sdcard/drm-text-console.cfg
# (legacy: /sdcard/drm-text-console.cfg si el exFAT esta montado ahi)
#
# Formato 1 - Juego RetroArch:   Nombre | core_libretro.so | ruta_rom [| thumb]
# Formato 2 - Comando generico:  Nombre | /usr/bin/programa [args...] [| thumb]
# Campos separados por '|'. Lineas '#' y vacias se ignoran.
# Core se busca en /sdcard/retro_lib/ o /mnt/sdcard/retro_lib/.
# Thumbs (opcional) en /mnt/sdcard/thumbs/<sistema>.png, fallback No_image.png.

# --- Juegos RetroArch (formato 1) ---
Flappy Bird (Intv) | freeintv_libretro.so | /mnt/sdcard/roms/INTV/flappy.int
Space Patrol (Intv) | freeintv_libretro.so | /mnt/sdcard/roms/INTV/spacepatrol.int
Pitfall! (Atari 2600) | stella_libretro.so | /mnt/sdcard/roms/A26/pitfall.a26
Super Mario (NES) | nestopia_libretro.so | /mnt/sdcard/roms/NES/smb.nes

# --- Comandos genericos (formato 2) ---
System Info lite | /bin/uname -a
Test miniGUI | /usr/bin/gameapp