# dtc.conf - configuracion de drm-text-console (GStick 4K Lite / RK3032)
#
# Instalar en /etc/dtc.conf (defaults de imagen) y/o en
# $HOME/.config/dtc.conf (sobrescritura de usuario). Si existe
# XDG_CONFIG_HOME se usa $XDG_CONFIG_HOME/dtc.conf en su lugar. Gana la ultima
# capa que defina la clave; las capas ausentes no son un error.
#
# Formato: "clave = valor". '#' comenta hasta el final de la linea. Los blancos
# alrededor de clave y valor se recortan. Clave desconocida o valor fuera de
# rango: se avisa por stderr (y al log persistente) y se ignora, sin romper el
# arranque.
#
# Este fichero es OPCIONAL y todas las claves vienen comentadas con su valor por
# defecto: el binario funciona igual sin el. Descomenta solo lo que quieras
# cambiar (asi el titulo por defecto, que lleva la version del binario, no se
# queda congelado en un numero viejo).

# --- Rutas -----------------------------------------------------------------
# Dispositivo DRM/KMS a abrir.
#drm_dev = /dev/dri/card0
# Prefijo de los dispositivos evdev (se anade "eventN").
#input_glob = /dev/input/
# Menu de juegos (ver examples/drm-text-console.cfg).
#game_cfg = /mnt/sdcard/drm-text-console.cfg
# Directorio de miniaturas PNG (por sistema + No_image.png).
#thumb_dir = /mnt/sdcard/thumbs
# Fondo: ruta extra que se prueba ANTES de las 3 por defecto
# (/mnt/sdcard/thumbs/fondo.png, /mnt/sdcard/fondo.png,
#  /usr/share/drm-text-console/fondo.png). Vacio = solo las 3 por defecto.
#bg_path =
# Log persistente. Vacio = candidatas /mnt/sdcard/dtcon.log, /sdcard/dtcon.log,
# /data/dtcon.log (la primera escribible).
#persist_log =
# Log de la salida de RetroArch. Vacio = /mnt/sdcard/retroarch.log, /sdcard/...
#retroarch_log =

# --- RetroArch -------------------------------------------------------------
#retroarch_bin = /usr/bin/retroarch
# Config base cuando la entrada del menu no trae una propia.
#retroarch_cfg = /etc/retroarch.cfg
# Si existe, se pasa con --appendconfig (sus valores ganan sobre retroarch_cfg).
# Vacio = no se pasa.
#retroarch_extra = /mnt/sdcard/retroarch-extra.cfg
# Directorios donde buscar <core>.so, separados por ';' (se usa el primero que
# tenga el core).
#core_dirs = /sdcard/retro_lib;/mnt/sdcard/retro_lib

# --- Shell VT (entrada "Shell" del menu) -----------------------------------
# Programa que se ejecuta en tty1 al soltar DRM master.
#shell = /bin/sh
# HOME que heredan los hijos lanzados (RetroArch, shell). Debe ser un punto de
# montaje real y escribible: las apps calculan $HOME/.config/... y fallan si no.
#child_home = /mnt/sdcard

# --- Ajustes ---------------------------------------------------------------
# Refresco vertical objetivo al elegir modo DRM: el modo mas cercano y, a
# igualdad, el de mayor resolucion. Rango 24..240.
#target_hz = 60
# Divisor de la escala del font: font_scale = alto / font_scale_div (a 1080p con
# 360 sale x3, ~45 filas; a 720p x2). Rango 60..1080.
#font_scale_div = 360
# Autorepeat del mando/teclado: retardo inicial y periodo, en ms.
#repeat_delay_ms = 400
#repeat_ms = 120
# Entradas por pagina en el menu de juegos. Rango 1..16.
#game_page = 8
# Atenuacion del fondo (0 = sin atenuar, 255 = fundido con el fondo). Rango 0..255.
#bg_dim = 90
# Cada cuantos segundos se rescannean los dispositivos de entrada. Rango 1..60.
#input_rescan_s = 2

# --- Titulo ----------------------------------------------------------------
# Texto de la barra superior. Por defecto incluye la version del binario; si lo
# fijas aqui, deja de seguir a BUILD_VSN.
#title = GStick 4K Lite - RK3032 Test Console (v9)
